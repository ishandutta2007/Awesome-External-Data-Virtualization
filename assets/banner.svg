<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Tech Mesh Radial Glow -->
    <radialGradient id="meshGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Core Ring Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Accent Gradient for Text & Badges -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCore {
      0% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.7)); }
      100% { transform: scale(1); opacity: 0.85; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle1 {
      0% { transform: translate(0, 0); opacity: 0.3; }
      50% { transform: translate(15px, -18px); opacity: 0.9; }
      100% { transform: translate(0, 0); opacity: 0.3; }
    }
    @keyframes floatParticle2 {
      0% { transform: translate(0, 0); opacity: 0.4; }
      50% { transform: translate(-20px, 15px); opacity: 1; }
      100% { transform: translate(0, 0); opacity: 0.4; }
    }
    @keyframes cardGlow {
      0% { stroke-opacity: 0.25; }
      50% { stroke-opacity: 0.75; }
      100% { stroke-opacity: 0.25; }
    }
    .core-pulse {
      transform-origin: 600px 92px;
      animation: pulseCore 5s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 12, 12;
      animation: dashFlow 4s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 12, 12;
      animation: dashFlow 3s linear infinite reverse;
    }
    .particle-1 {
      animation: floatParticle1 6s ease-in-out infinite;
    }
    .particle-2 {
      animation: floatParticle2 5s ease-in-out infinite;
    }
    .pill-card {
      animation: cardGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#meshGlow)" rx="16" />

  <!-- Subtle Architectural Grid -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Data Streams (Behind Foreground Content) -->
  <g fill="none">
    <path d="M 60 92 C 240 92, 380 92, 540 92" stroke="url(#streamGrad1)" stroke-width="2.5" class="flow-line" />
    <path d="M 1140 92 C 960 92, 820 92, 660 92" stroke="url(#streamGrad2)" stroke-width="2.5" class="flow-line-reverse" />
    
    <!-- Diagonal Streams Connecting Sources to Central Virtual Layer -->
    <path d="M 120 330 C 260 260, 420 180, 560 115" stroke="url(#streamGrad1)" stroke-width="2" stroke-opacity="0.6" class="flow-line" />
    <path d="M 1080 330 C 940 260, 780 180, 640 115" stroke="url(#streamGrad2)" stroke-width="2" stroke-opacity="0.6" class="flow-line-reverse" />
  </g>

  <!-- Animated Data Packets / Nodes -->
  <g class="particle-1">
    <circle cx="210" cy="92" r="4.5" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="980" cy="92" r="4" fill="#F472B6" filter="url(#glow)" />
    <circle cx="280" cy="245" r="3.5" fill="#818CF8" />
  </g>
  <g class="particle-2">
    <circle cx="390" cy="92" r="5" fill="#818CF8" filter="url(#glow)" />
    <circle cx="830" cy="92" r="4.5" fill="#A855F7" filter="url(#glow)" />
    <circle cx="920" cy="245" r="4" fill="#38BDF8" />
  </g>

  <!-- Background Peripheral Source Badges -->
  <g opacity="0.85">
    <!-- Left Source: Databases -->
    <g transform="translate(60, 68)" class="pill-card">
      <rect width="140" height="46" rx="23" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-width="1.2" />
      <text x="70" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">🗄️ Relational &amp; NoSQL</text>
    </g>

    <!-- Right Source: Data Lakes -->
    <g transform="translate(1000, 68)" class="pill-card">
      <rect width="140" height="46" rx="23" fill="#1E293B" fill-opacity="0.75" stroke="#A855F7" stroke-width="1.2" />
      <text x="70" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">❄️ Lakes &amp; Iceberg</text>
    </g>
  </g>

  <!-- Center Virtual Layer Core (Dynamic Pulsing Hub) -->
  <g class="core-pulse">
    <circle cx="600" cy="92" r="38" fill="none" stroke="url(#coreGrad)" stroke-width="3" filter="url(#glow)" stroke-dasharray="6, 6" />
    <circle cx="600" cy="92" r="28" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <path d="M588 92 L600 80 L612 92 L600 104 Z" fill="url(#textGrad)" />
    <circle cx="600" cy="92" r="4" fill="#FFFFFF" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Feature Badges -->
  <!-- Guaranteed Foreground Layer (No occlusion) -->
  <g id="foreground-layer">
    <!-- Top Category Eyebrow Pill -->
    <g transform="translate(460, 160)">
      <rect width="280" height="30" rx="15" fill="#1E293B" stroke="#6366F1" stroke-width="1.2" fill-opacity="0.9" />
      <text x="140" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="1.8" text-anchor="middle">✨ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 3px 12px rgba(0,0,0,0.85))">
      AWESOME EXTERNAL DATA VIRTUALIZATION
    </text>

    <!-- Subtitle -->
    <text x="600" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.3">
      Federated Queries <tspan fill="#38BDF8">•</tspan> Zero-Copy Integration <tspan fill="#A855F7">•</tspan> Unified Logical Data Fabrics
    </text>

    <!-- Bottom Feature Tag Pills -->
    <g transform="translate(195, 335)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="185" height="38" rx="19" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
        <text x="92.5" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">⚡ Zero-Copy ETL</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(205, 0)">
        <rect width="195" height="38" rx="19" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" />
        <text x="97.5" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">🔍 Federated SQL Queries</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(420, 0)">
        <rect width="190" height="38" rx="19" fill="#0F172A" stroke="#A855F7" stroke-width="1.2" />
        <text x="95" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">🌐 Hybrid Multi-Cloud</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(630, 0)">
        <rect width="180" height="38" rx="19" fill="#0F172A" stroke="#EC4899" stroke-width="1.2" />
        <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">🤖 AI &amp; Semantic Layers</text>
      </g>
    </g>
  </g>
</svg>
